<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Games</title>
  <meta name="description" content="All my ad-free games in one place.">
  <meta name="theme-color" content="#eef3ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My Games">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // Set light/dark before the page paints so it never flashes the wrong colors.
    (function () {
      var a = 'auto';
      try { a = localStorage.getItem('hub-appearance') || 'auto'; } catch (e) {}
      var dark = a === 'dark' || (a === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'forest' : 'meadow';
    })();
  </script>
  <link rel="stylesheet" href="hub.css">
</head>
<body>
  <main>
    <header class="top">
      <div>
        <p class="hello" id="hello">Hello</p>
        <h1>My Games</h1>
      </div>
      <button id="modeBtn" class="mode" aria-label="Switch light or dark"></button>
    </header>

    <div id="list" class="list" aria-live="polite"></div>
    <p class="soon">New games show up here on their own.</p>
  </main>
  <script src="hub.js"></script>
</body>
</html>
