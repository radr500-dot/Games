<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Games</title>
  <style>
    :root { --bg: #f5efe3; --ink: #2f3d2b; --card: #fffaf0; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1d231b; --ink: #ece6d6; --card: #262d23; } }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, system-ui, sans-serif; }
    main { max-width: 520px; margin: 0 auto; padding: 32px 16px; }
    a { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 18px; background: var(--card); color: inherit; text-decoration: none; margin-bottom: 12px; }
    img { width: 56px; height: 56px; border-radius: 14px; }
    small { display: block; opacity: .7; }
  </style>
</head>
<body>
  <main>
    <h1>My Games</h1>
    <a href="plot-twist/"><img src="plot-twist/icons/icon-192.png" alt=""><span><b>Plot Twist</b><small>One bloom per row, column and plot.</small></span></a>
  </main>
</body>
</html>
