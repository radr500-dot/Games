<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Orchard Bakery</title>
  <meta name="description" content="A calm 3D bakery game: pick apples, bake pies, run your shop.">
  <meta name="theme-color" content="#86C93F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Orchard Bakery">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script>
    // If anything stops the game from starting, say so on the start screen instead of leaving it blank.
    (function () {
      function show(msg) {
        var el = document.getElementById('loading'); if (!el) return;
        el.hidden = false; el.textContent = 'Sorry, the bakery could not open: ' + msg + ' Try reloading the page.';
      }
      window.addEventListener('error', function (e) { show((e.message || 'unknown error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '') + '.'); });
      window.addEventListener('unhandledrejection', function (e) { show(String(e.reason && e.reason.message || e.reason) + '.'); });
      setTimeout(function () { if (!window.__obReady) show('it is taking too long to start.'); }, 25000);
    })();
  </script>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="lens" aria-hidden="true"></div>

  <!-- Start screen: the bakery scene from the Design art behind a big title -->
  <main id="start">
    <div class="start-top">
      <h1 class="ob-title">Orchard<br>Bakery</h1>
      <div class="ob-ribbon">Grow · Bake · Sell</div>
    </div>
    <div class="start-bottom">
      <p id="loading" class="small">Getting the ovens warm…</p>
      <button id="playBtn" class="ob-btn ob-btn--play" disabled><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg><span id="playLabel">Play</span></button>
      <a class="hub-pill ob-btn ob-btn--cream" href="../"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 7.5a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>My Games</a>
      <button id="resetBtn" class="link">Start a new bakery</button>
    </div>
  </main>

  <!-- In-game top bar -->
  <header id="hud" hidden>
    <div class="row row1">
      <div class="ob-chip"><img id="coinIcon" alt=""><span id="coinNum">0</span></div>
      <div class="ob-chip" title="Goods sold"><img id="carryIcon" alt=""><span id="soldNum">0</span><small class="wide">sold</small></div>
      <button class="ob-chip lv-chip" id="lvPill" aria-label="Bakery level and goals"><span class="star"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2.6l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg><b id="lvNum">1</b></span><span class="lv-txt"><span class="lv-top"><span>Level <span id="lvNum2">1</span></span><span id="xpText" class="wide"></span></span><span class="ob-bar"><i id="xpFill"></i></span></span></button>
    </div>
    <div class="row row2">
      <button id="goalsBtn" class="ob-chip orders-btn" aria-label="Orders and goals"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M8.5 12l2 2 4-4"/><path d="M8.5 17h7"/></svg>Orders<span id="goalsDot" class="badge" hidden></span></button>
      <span class="grow"></span>
      <button id="soundBtn" class="ob-icon-btn" aria-label="Sound on"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 9a4 4 0 0 1 0 6"/><path class="wave" d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path class="mute" d="M16 9l5 6M21 9l-5 6"/></svg></button>
      <button id="menuBtn" class="ob-icon-btn" aria-label="Pause" title="Pause"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
      <a class="ob-icon-btn hub-link" href="../" aria-label="My Games" title="My Games"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg></a>
    </div>
  </header>
  <div id="carryPill" class="carry-tag" hidden><span id="carryNum">0/8</span></div>
  <div id="keyHint" hidden><span class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span>or arrow keys to walk</span><i></i><span class="tree-tip">Stand still by a tree to pick</span></div>
  <div id="floats" aria-hidden="true"></div>
  <div id="hint" hidden></div>
  <div id="carryList" hidden aria-live="polite"></div>
  <section id="panel" hidden aria-label="Goals">
    <div class="panel-card">
      <i class="handle"></i><div class="panel-head"><h2>Your bakery</h2><button id="panelClose" class="ob-icon-btn" aria-label="Close"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="lv-row"><div class="lv-badge">★ <span id="pLv">1</span></div><div class="lv-text"><b id="pLvTitle">Bakery level 1</b><div class="bar"><i id="pXp"></i></div><small id="pXpText"></small></div></div>
      <h3>Tasks</h3><ul id="taskList" class="tasks"></ul>
      <h3>Orders</h3><div id="orderBox" class="order-box"></div>
      <h3>Coming up</h3><ul id="nextList" class="next"></ul>
      <button id="panelSound" class="sound-row">Sound: on</button>
    </div>
  </section>
  <div id="toast"></div>
  <div id="joy"><div id="knob"></div></div>

  <script type="module" src="app.js"></script>
</body>
</html>
